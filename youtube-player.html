<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>WordAhead YouTube Player</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;color:#eee;font:12px/1.4 system-ui}body{display:grid;grid-template-rows:minmax(200px,1fr) auto}#player{width:100%;height:100%;min-height:200px}#status{padding:6px 8px;background:#182222;display:flex;gap:8px;align-items:center}#message{flex:1}a{color:#a5dfcc;white-space:nowrap}</style></head><body>
<div id="player"></div>
<script>
(() => {
  let player=null,ready=false,pending=null,currentId=null,timeTimer=null,playbackRate=1,suspended=false,restoringRate=null,resumeUntil=0,settings={};
  const message=document.querySelector('#message'),external=document.querySelector('#external');
  function status(text){if(message)message.textContent=text;}
  function reconcileRate(){if(Date.now()<resumeUntil&&player.getPlaybackRate()!==playbackRate){restoringRate=playbackRate;player.setPlaybackRate(playbackRate);}}
  function publishTime(){if(!ready||suspended)return;reconcileRate();const state=player.getPlayerState();if(![YT.PlayerState.PLAYING,2,5].includes(state))return;const actual=player.getVideoData?.().video_id;if(actual&&currentId&&actual!==currentId)return;const payload={type:'wordahead-player-time',videoId:currentId,time:player.getCurrentTime(),rate:playbackRate};if(window.parent!==window)window.parent.postMessage(payload,location.origin);try{window.webkit?.messageHandlers?.youtubeState?.postMessage(payload)}catch{}}
  function captureSettings(){
    if(!ready)return settings;
    settings={...settings,rate:playbackRate};
    try{settings.volume=player.getVolume();settings.muted=player.isMuted();const size=player.getOption('captions','fontSize');if(Number.isFinite(size))settings.captionFontSize=size;}catch{}
    try{localStorage.setItem('wordahead-player-settings',JSON.stringify(settings));}catch{}
    try{window.webkit?.messageHandlers?.youtubeSettings?.postMessage(settings);}catch{}
    return settings;
  }
  function restoreSettings(value){
    if(value&&typeof value==='object')settings={...settings,...value};suspended=false;resumeUntil=Date.now()+5000;
    if(!ready)return;
    if(Number.isFinite(settings.rate)&&settings.rate>0){playbackRate=settings.rate;restoringRate=playbackRate;if(player.getPlaybackRate()!==playbackRate)player.setPlaybackRate(playbackRate);else restoringRate=null;}
    try{if(Number.isFinite(settings.volume))player.setVolume(settings.volume);if(settings.muted===true)player.mute();else if(settings.muted===false)player.unMute();if(Number.isFinite(settings.captionFontSize))player.setOption('captions','fontSize',settings.captionFontSize);}catch{}
  }
  try{settings=JSON.parse(localStorage.getItem('wordahead-player-settings')||'{}');if(Number.isFinite(settings.rate))playbackRate=settings.rate;}catch{}
  function apply(){
    if(!ready||!pending)return;
    const command=pending;pending=null;
    if(command.rate)playbackRate=command.rate;
    if(command.action==='rate'){if(ready)player.setPlaybackRate(playbackRate);return;}
    if(command.action==='pause'){player.pauseVideo();return;}
    const start=command.start||0;
    if(external)external.href=`https://www.youtube.com/watch?v=${command.videoId}&t=${Math.floor(start)}s`;
    if(currentId!==command.videoId){
      currentId=command.videoId;
      const options={videoId:currentId,startSeconds:start};
      if(command.play)player.loadVideoById(options);else player.cueVideoById(options);
    }else if(command.action==='seek'){
      player.seekTo(start,true);if(command.play)player.playVideo();
    }
    status(command.play?'선택한 자막 위치에서 재생합니다.':'영상 재생 버튼을 눌러 시작하세요.');
  }
  window.WordAheadYouTube={
    load(command){
      if(command.action==='rate'){this.setRate(command.rate);return;}
      if(command.action==='pause'){
        if(pending)pending={...pending,play:false};
        if(ready)player.pauseVideo();return;
      }
      if(!/^[A-Za-z0-9_-]{11}$/.test(command.videoId||'')||typeof command.start!=='number'||!Number.isFinite(command.start)||command.start<0)return;
      pending=command;apply();
    },
    getSettings:captureSettings,restoreSettings,
    suspend(){captureSettings();suspended=true;this.load({action:'pause'});},
    setRate(rate){const value=Number(rate);if(!Number.isFinite(value)||value<=0)return;playbackRate=value;settings.rate=value;if(pending)pending={...pending,rate:value};if(ready&&player.getPlaybackRate()!==playbackRate)player.setPlaybackRate(playbackRate);},
    getState(){return {ready,videoId:currentId,time:ready?player.getCurrentTime():0,state:ready?player.getPlayerState():null};}
  };
  window.addEventListener('message',event=>{
    if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='wordahead-player')return;
    window.WordAheadYouTube.load(event.data);
  });
  window.onYouTubeIframeAPIReady=()=>{
    const base=new URL(document.baseURI).origin;
    player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{playsinline:1,controls:1,origin:base},events:{
      onReady(){ready=true;apply();restoreSettings(settings);player.setPlaybackRate(playbackRate);if(!timeTimer)timeTimer=setInterval(publishTime,300);},
      onStateChange(event){if(event.data===YT.PlayerState.PLAYING&&!document.hidden){if(suspended)resumeUntil=Date.now()+5000;suspended=false;if(player.getPlaybackRate()!==playbackRate){restoringRate=playbackRate;player.setPlaybackRate(playbackRate);}}publishTime();},
      onPlaybackRateChange(event){if(Number.isFinite(event.data)&&event.data>0&&!suspended){if(Date.now()<resumeUntil&&event.data!==playbackRate){reconcileRate();return;}restoringRate=null;playbackRate=event.data;settings.rate=playbackRate;const payload={type:'wordahead-player-time',rate:playbackRate};if(window.parent!==window)window.parent.postMessage(payload,location.origin);try{window.webkit?.messageHandlers?.youtubeState?.postMessage(payload)}catch{}}},
      onApiChange(){if(restoringRate!==null)restoreSettings(settings);},
      onError(event){status([101,150].includes(event.data)?'이 영상은 앱 내 재생이 제한되어 있어요.':event.data===153?'플레이어 연결 인증을 확인할 수 없습니다.':event.data===100?'삭제되었거나 비공개인 영상입니다.':'영상을 재생할 수 없습니다. YouTube에서 열어주세요.');},
      onAutoplayBlocked(){status('플레이어의 재생 버튼을 한 번 눌러주세요. 이후 자막 시간으로 이동할 수 있어요.');}
    }});
  };
  const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';
  script.onerror=()=>status('YouTube에 연결할 수 없습니다. 인터넷 연결을 확인해주세요.');document.head.append(script);
  setTimeout(()=>{if(!ready)status('플레이어 연결이 지연되고 있어요. YouTube에서 열 수도 있습니다.');},15000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)window.WordAheadYouTube.suspend();else window.WordAheadYouTube.restoreSettings(settings);});
})();
</script></body></html>
